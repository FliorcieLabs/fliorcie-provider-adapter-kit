[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fliorcie-provider-adapter-kit"
version = "0.1.0"
description = "Local-first provider adapter protocol and conformance harness for Fliorcie Community."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Fliorcie Labs"}]
dependencies = []

[project.scripts]
fl-provider-kit = "fl_provider_adapter_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

